services:
  - type: web
    name: ai-interactive-livestreaming
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true